version: "3.9"
services:
  ingest:
    build: .
    image: faiss-chat:latest
    command: ["python", "ingest.py"]
    volumes:
      - ./data:/data
      - faiss-index:/app/faiss_index

  api:
    build: .
    image: faiss-chat:latest
    depends_on:
      - ingest
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data:ro
      - faiss-index:/app/faiss_index

volumes:
  faiss-index:
